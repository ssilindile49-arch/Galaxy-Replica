
name: Build Galaxy Replica VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure project
        run: cmake -S . -B build -A x64 "-DJUCE_DIR=${{ github.workspace }}/JUCE"

      - name: Build plugin
        run: cmake --build build --config Release

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Replica-VST3
          path: build/**/*.vst3/**
          if-no-files-found: error
